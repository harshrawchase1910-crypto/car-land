.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.packs .card{margin:0}details{margin-top:6px;font-size:.85rem}summary{cursor:pointer;color:var(--acc);font-weight:700}

.badge .bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;width:90px;margin:3px 0}.badge .bar i{display:block;height:100%;background:var(--b)}.badge small{font-size:.65rem;color:var(--mut)}

.cr{vertical-align:-.25em}.car .cg{position:absolute;top:5px;left:6px;line-height:0}
.r4c{filter:drop-shadow(0 0 4px #ff9f1a)}.r5c{animation:chroma 3s linear infinite}.r6c{filter:drop-shadow(0 0 5px #ffd700)}.r7c{filter:drop-shadow(0 0 7px #b46bff)}
.big{max-width:240px;margin:12px auto;padding:20px}.big .e{font-size:5rem}
.pop{animation:pop .5s}@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:3px 0}
.c{text-align:center}
.ic{background:none;padding:0 3px;font-size:1rem;opacity:.35;color:inherit}.ic.on{opacity:1;filter:drop-shadow(0 0 4px #b46bff)}

.gbx{max-height:420px;overflow:auto;padding:6px;margin-top:8px;border:2px solid var(--bd);border-radius:12px}
.pick{cursor:pointer;position:relative}.pick.on .car{outline:4px solid var(--acc);outline-offset:-3px}.pick.on::after{content:"✅";position:absolute;bottom:6px;right:8px}

.r8::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 2.5s ease-in-out infinite;pointer-events:none}
.r8.pop{animation:pop .5s,chroma 2.5s linear infinite}
.bellb{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:6px 12px;color:var(--tx);font-size:1rem}
#bcnt{position:absolute;top:-7px;right:-6px;background:#e84a5f;color:#fff;border-radius:10px;font-size:.7rem;padding:1px 6px;display:none;font-weight:700}
.ring{animation:ring .8s}@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
.tst{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);color:var(--tx);border:2px solid var(--acc);border-radius:14px;padding:10px 16px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}.tst.show{opacity:1;transform:translate(-50%,0)}
/* animations */
.car{overflow:hidden;transition:transform .2s}.car:hover{transform:translateY(-4px) scale(1.04)}
.car .e svg{animation:bob 3s ease-in-out infinite}
.grid .car:nth-child(3n) .e svg{animation-delay:-.8s}.grid .car:nth-child(3n+1) .e svg{animation-delay:-1.6s}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .1s linear infinite}.car:hover .wh{animation-duration:.04s}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
.r3c{animation:pulse 2.4s ease-in-out infinite}.r4c{animation:pulse 2s ease-in-out infinite}.r6c{animation:pulse 1.6s ease-in-out infinite}.r7c{animation:pulse 1.2s ease-in-out infinite}
.r3::after,.r4::after,.r5::after,.r6::after,.r7::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
.r7{background-size:200% 200%;animation:aura 5s ease-in-out infinite}
.r5.pop{animation:pop .5s,chroma 3s linear infinite}.r7.pop{animation:pop .5s,aura 5s ease-in-out infinite}
.lock *,.lock::after{animation:none!important}.lock::after{display:none}.lock:hover{transform:none}
.shake{animation:shake .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
